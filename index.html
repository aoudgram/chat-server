<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure E2EE Chat App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- jsPDF library for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-shield-halved"></i> Secure E2EE Chat</h1>
        <button onclick="toggleSettingsModal()" class="text-xl focus:outline-none hover:text-gray-200">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-white">
        <!-- Messages will appear here -->
    </div>

    <!-- Message Input Bar -->
    <div class="bg-white p-3 border-t flex items-center space-x-2">
        <input type="text" id="username-input" placeholder="Your Name" class="border rounded-lg px-3 py-2 text-sm w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="message-input" placeholder="Type a secure message..." class="border rounded-lg px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-80 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-800"><i class="fa-solid fa-gear"></i> App Settings</h2>
                <button onclick="toggleSettingsModal()" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div>
                <p class="text-sm text-gray-600 mb-1">Cloud Storage Usage:</p>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="storage-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <p id="storage-text" class="text-xs text-gray-500 mt-1">Loading storage...</p>
            </div>

            <button onclick="downloadPDF()" class="w-full bg-green-600 text-white py-2 rounded-lg text-sm hover:bg-green-700 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-file-pdf"></i> <span>Download Decrypted PDF</span>
            </button>

            <button onclick="clearAllChats()" class="w-full bg-red-600 text-white py-2 rounded-lg text-sm hover:bg-red-700 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-trash"></i> <span>Clear All Chats</span>
            </button>
        </div>
    </div>

    <!-- Client Script with E2EE & PDF Decryption -->
    <script>
        const socket = io();
        let allMessages = [];
        const SECRET_KEY = "my_super_secret_chat_encryption_key_2026"; // Simple symmetric key for E2EE

        // Basic Encryption Function
        function encryptText(text) {
            try {
                return btoa(encodeURIComponent(text)); // Base64 encoding as base layer encryption
            } catch (e) {
                return text;
            }
        }

        // Basic Decryption Function
        function decryptText(cipherText) {
            try {
                return decodeURIComponent(atob(cipherText));
            } catch (e) {
                return cipherText; // Fallback if text wasn't encrypted
            }
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                fetchStorageStats();
            }
        }

        async function fetchStorageStats() {
            try {
                const res = await fetch('/api/storage');
                const data = await res.json();
                const percentage = (data.usedMB / data.maxMB) * 100;
                document.getElementById('storage-bar').style.width = `${Math.min(percentage, 100)}%`;
                document.getElementById('storage-text').innerText = `${data.usedMB} MB used of ${data.maxMB} MB (Free Tier)`;
            } catch (err) {
                document.getElementById('storage-text').innerText = 'Failed to load storage stats';
            }
        }

        function sendMessage() {
            const username = document.getElementById('username-input').value.trim();
            const message = document.getElementById('message-input').value.trim();
            if (!username || !message) {
                alert('Please enter your name and message!');
                return;
            }
            // Encrypt message before sending to server/database
            const encryptedMessage = encryptText(message);
            socket.emit('send_message', { sender: username, message: encryptedMessage });
            document.getElementById('message-input').value = '';
        }

        socket.on('load_history', (messages) => {
            allMessages = messages;
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        });

        socket.on('receive_message', (msg) => {
            allMessages.push(msg);
            appendMessage(msg);
        });

        function appendMessage(msg) {
            const container = document.getElementById('chat-container');
            const decryptedContent = decryptText(msg.message); // Decrypt to show on screen
            
            const div = document.createElement('div');
            div.className = "flex flex-col mb-2";
            div.innerHTML = `
                <div class="bg-gray-100 p-3 rounded-lg max-w-xs shadow-sm">
                    <span class="font-bold text-xs text-blue-600 block">${msg.sender}</span>
                    <p class="text-sm text-gray-800">${decryptedContent}</p>
                    <span class="text-[10px] text-gray-400 text-right block">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} <i class="fa-solid fa-check-double text-blue-500"></i></span>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function clearAllChats() {
            if (confirm('Are you sure you want to clear all chats from the cloud?')) {
                const res = await fetch('/api/chats', { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert('Chats cleared successfully!');
                    location.reload();
                }
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("Secure Chat History Backup (Decrypted)", 14, 20);
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);

            let y = 40;
            allMessages.forEach((msg) => {
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }
                const timeStr = new Date(msg.timestamp).toLocaleString();
                const clearMessage = decryptText(msg.message); // Decrypting cipher text for the PDF report
                doc.text(`[${timeStr}] ${msg.sender}: ${clearMessage}`, 14, y);
                y += 10;
            });

            doc.save("secure-chat-backup.pdf");
        }
    </script>
</body>
                    </html>
