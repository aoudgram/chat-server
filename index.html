<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verified Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- Auth Screen (Signup / Login) -->
    <div id="auth-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm space-y-4 border border-gray-100">
            <div class="text-center">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2 text-xl shadow-md">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 id="auth-title" class="text-xl font-bold text-gray-800">Create Account</h2>
                <p id="auth-subtitle" class="text-xs text-gray-500 mt-1">Join the secure 1-to-1 encrypted network</p>
            </div>
            
            <div id="contact-field-container">
                <label class="text-xs font-semibold text-gray-600">Mobile Number / Email</label>
                <input type="text" id="contact-input" placeholder="e.g. 9950972498" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="text-xs font-semibold text-gray-600" id="username-label">Username (Min 4 letters)</label>
                <input type="text" id="reg-username-input" placeholder="e.g. vikas or deepesh" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="text-xs font-semibold text-gray-600">Password</label>
                <input type="password" id="password-input" placeholder="Enter secure password" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <p id="auth-error" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <button id="auth-btn" onclick="handleAuthSubmit()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 shadow-md">Create Account</button>
            
            <div class="text-center pt-1">
                <p class="text-xs text-gray-500">Already have an account? <span onclick="toggleAuthMode()" id="switch-auth-link" class="text-blue-600 font-semibold cursor-pointer hover:underline">Login</span></p>
            </div>
        </div>
    </div>

    <!-- Main WhatsApp-Style App -->
    <div id="main-app" class="flex-1 flex flex-col hidden h-screen">
        <!-- Header -->
        <header class="bg-emerald-700 text-white p-3 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <div id="header-avatar" class="w-10 h-10 rounded-full bg-emerald-800 flex items-center justify-center font-bold text-sm shadow">V</div>
                <div>
                    <h1 id="current-user-display" class="text-sm font-bold flex items-center space-x-1"></h1>
                    <span class="text-[10px] text-emerald-200">Online & Secure E2EE</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="logoutUser()" class="text-xs bg-emerald-800 px-2.5 py-1.5 rounded-lg hover:bg-emerald-900"><i class="fa-solid fa-right-from-bracket"></i></button>
                <!-- Settings Icon ONLY visible to Owner @vikas (9950972498) -->
                <button id="owner-settings-btn" onclick="toggleSettingsModal()" class="text-lg focus:outline-none hover:text-emerald-200 hidden">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div id="user-profile-badge" class="w-9 h-9 rounded-full bg-emerald-800 flex items-center justify-center font-bold text-xs shadow border border-emerald-500 hidden"></div>
            </div>
        </header>

        <!-- Body Layout (WhatsApp Style Sidebar + Chat) -->
        <div class="flex-1 flex overflow-hidden bg-gray-100">
            <!-- Contact Sidebar -->
            <div class="w-full md:w-1/3 bg-white border-r flex flex-col">
                <div class="p-3 bg-gray-50 border-b flex justify-between items-center">
                    <span class="font-bold text-xs text-gray-600"><i class="fa-solid fa-comments"></i> CHATS</span>
                    <button onclick="loadContacts()" class="text-gray-500 hover:text-emerald-700 text-xs"><i class="fa-solid fa-rotate"></i></button>
                </div>
                <div id="contacts-list" class="flex-1 overflow-y-auto divide-y divide-gray-100"></div>
            </div>

            <!-- Chat Window -->
            <div class="hidden md:flex flex-1 flex-col bg-[#efeae2]" id="chat-window-pane">
                <div id="chat-header" class="p-3 bg-white border-b font-bold text-sm text-gray-800 flex items-center space-x-3 shadow-sm">
                    <span>Select a contact to start chatting</span>
                </div>
                <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px]"></div>
                <!-- Input Box -->
                <div id="chat-input-bar" class="bg-gray-100 p-3 border-t flex items-center space-x-2 hidden">
                    <input type="text" id="message-input" placeholder="Type a secure message..." class="border rounded-full px-4 py-2.5 text-sm flex-1 focus:outline-none focus:ring-1 focus:ring-emerald-600 bg-white shadow-sm" onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-emerald-700 text-white w-10 h-10 rounded-full text-sm hover:bg-emerald-800 flex items-center justify-center shadow">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Owner Settings Modal (PDF Export & Storage) -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl w-80 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-800"><i class="fa-solid fa-gear"></i> Owner Controls</h2>
                <button onclick="toggleSettingsModal()" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <p class="text-xs text-gray-600 mb-1">Cloud Storage Usage (Max 500 MB Free Tier):</p>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="storage-bar" class="bg-emerald-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <p id="storage-text" class="text-xs text-gray-500 mt-1">Loading storage...</p>
            </div>
            <button onclick="downloadDecryptedPDF()" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700 flex items-center justify-center space-x-2 shadow">
                <i class="fa-solid fa-file-pdf"></i> <span>Download All Chats (PDF)</span>
            </button>
            <button onclick="clearAllChats()" class="w-full bg-red-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-red-700 flex items-center justify-center space-x-2 shadow">
                <i class="fa-solid fa-trash"></i> <span>Clear All Chats (Cloud)</span>
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = localStorage.getItem('chat_username') || null;
        let currentUserContact = localStorage.getItem('chat_contact') || null;
        let activeChatUser = null;
        let allMessages = [];
        let isLoginMode = false;
        let onlineUsersList = [];

        window.onload = () => {
            if (currentUser) {
                initAppUI();
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-error').classList.add('hidden');
            if (isLoginMode) {
                document.getElementById('auth-title').innerText = "Login to Chat";
                document.getElementById('auth-subtitle').innerText = "Enter your credentials to restore chat";
                document.getElementById('contact-field-container').querySelector('label').innerText = "Username or Mobile/Email";
                document.getElementById('contact-input').placeholder = "Enter username or mobile";
                document.getElementById('username-label').innerText = "Password Verification";
                document.getElementById('reg-username-input').type = "password";
                document.getElementById('reg-username-input').placeholder = "Enter your password";
                document.getElementById('password-input').parentElement.style.display = "none";
                document.getElementById('auth-btn').innerText = "Login & Open App";
                document.getElementById('switch-auth-link').innerText = "Create Account";
            } else {
                document.getElementById('auth-title').innerText = "Create Account";
                document.getElementById('auth-subtitle').innerText = "Join the secure 1-to-1 encrypted network";
                document.getElementById('contact-field-container').querySelector('label').innerText = "Mobile Number / Email";
                document.getElementById('contact-input').placeholder = "e.g. 9950972498";
                document.getElementById('username-label').innerText = "Username (Min 4 letters)";
                document.getElementById('reg-username-input').type = "text";
                document.getElementById('reg-username-input').placeholder = "e.g. vikas or deepesh";
                document.getElementById('password-input').parentElement.style.display = "block";
                document.getElementById('auth-btn').innerText = "Create Account";
                document.getElementById('switch-auth-link').innerText = "Login";
            }
        }

        async function handleAuthSubmit() {
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            if (isLoginMode) {
                const identifier = document.getElementById('contact-input').value.trim();
                const password = document.getElementById('reg-username-input').value.trim();

                if (!identifier || !password) {
                    errorEl.innerText = "Please fill all fields!";
                    errorEl.classList.remove('hidden');
                    return;
                }

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifier, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        saveUserSession(data.user);
                    } else {
                        errorEl.innerText = data.error;
                        errorEl.classList.remove('hidden');
                    }
                } catch (err) {
                    errorEl.innerText = "Network error. Try again.";
                    errorEl.classList.remove('hidden');
                }
            } else {
                const contactInfo = document.getElementById('contact-input').value.trim();
                let username = document.getElementById('reg-username-input').value.trim().replace('@', '');
                const password = document.getElementById('password-input').value.trim();

                if (!contactInfo || !username || !password) {
                    errorEl.innerText = "Please fill all fields!";
                    errorEl.classList.remove('hidden');
                    return;
                }

                if (username.length < 4) {
                    errorEl.innerText = "Username must be at least 4 letters!";
                    errorEl.classList.remove('hidden');
                    return;
                }

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contactInfo, username, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        saveUserSession(data.user);
                    } else {
                        errorEl.innerText = data.error;
                        errorEl.classList.remove('hidden');
                    }
                } catch (err) {
                    errorEl.innerText = "Network error. Try again.";
                    errorEl.classList.remove('hidden');
                }
            }
        }

        function saveUserSession(user) {
            currentUser = user.username;
            currentUserContact = user.contactInfo;
            localStorage.setItem('chat_username', currentUser);
            localStorage.setItem('chat_contact', currentUserContact);
            initAppUI();
        }

        function initAppUI() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            // Set User Avatar & Display Name
            const initials = getInitials(currentUser);
            document.getElementById('header-avatar').innerText = initials;
            document.getElementById('current-user-display').innerHTML = `@${currentUser} <i class="fa-solid fa-circle-check text-blue-300 text-xs"></i>`;

            // Check if Owner (@vikas & 9950972498)
            if (currentUser.toLowerCase() === 'vikas' && currentUserContact === '9950972498') {
                document.getElementById('owner-settings-btn').classList.remove('hidden');
            } else {
                const profileBadge = document.getElementById('user-profile-badge');
                profileBadge.innerText = initials;
                profileBadge.classList.remove('hidden');
            }

            socket.emit('user_online', currentUser);
            loadContacts();
        }

        function getInitials(name) {
            if (!name) return 'U';
            if (name.length <= 2) return name.toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function logoutUser() {
            localStorage.removeItem('chat_username');
            localStorage.removeItem('chat_contact');
            location.reload();
        }

        socket.on('update_online_users', (users) => {
            onlineUsersList = users;
            loadContacts();
        });

        async function loadContacts() {
            try {
                const res = await fetch('/api/users');
                const users = await res.json();
                const container = document.getElementById('contacts-list');
                container.innerHTML = '';

                users.forEach(user => {
                    if (user.username === currentUser) return;
                    const isOnline = onlineUsersList.includes(user.username);
                    const initials = getInitials(user.username);

                    const div = document.createElement('div');
                    div.className = "p-3 hover:bg-gray-50 cursor-pointer flex items-center justify-between transition";
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="relative">
                                <div class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow">
                                    ${initials}
                                </div>
                                ${isOnline ? '<span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></span>' : ''}
                            </div>
                            <div>
                                <span class="font-bold text-sm text-gray-800">@${user.username} <i class="fa-solid fa-circle-check text-blue-500 text-xs"></i></span>
                                <p class="text-xs text-gray-500">Tap to chat securely</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                    `;
                    div.onclick = () => selectContact(user.username);
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Failed to load contacts");
            }
        }

        function selectContact(username) {
            activeChatUser = username;
            const initials = getInitials(username);
            const isOnline = onlineUsersList.includes(username);

            document.getElementById('chat-window-pane').classList.remove('hidden');
            document.getElementById('chat-header').innerHTML = `
                <div class="relative">
                    <div class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-xs">
                        ${initials}
                    </div>
                    ${isOnline ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>' : ''}
                </div>
                <div>
                    <span class="text-gray-800 font-bold">@${username}</span> <i class="fa-solid fa-circle-check text-blue-500 text-xs"></i>
                    <span class="text-[10px] text-gray-500 block">${isOnline ? 'Online' : 'Offline'}</span>
                </div>
            `;
            document.getElementById('chat-input-bar').classList.remove('hidden');
            socket.emit('get_history', { user1: currentUser, user2: activeChatUser });
        }

        function encryptText(text) {
            try { return btoa(encodeURIComponent(text)); } catch (e) { return text; }
        }

        function decryptText(cipherText) {
            try { return decodeURIComponent(atob(cipherText)); } catch (e) { return cipherText; }
        }

        function sendMessage() {
            const message = document.getElementById('message-input').value.trim();
            if (!message || !activeChatUser) return;

            const encryptedMessage = encryptText(message);
            socket.emit('send_message', {
                sender: currentUser,
                receiver: activeChatUser,
                message: encryptedMessage
            });
            document.getElementById('message-input').value = '';
        }

        socket.on('load_history', (messages) => {
            allMessages = messages;
            renderMessages(messages);
        });

        socket.on('receive_message', (msg) => {
            if ((msg.sender === currentUser && msg.receiver === activeChatUser) ||
                (msg.sender === activeChatUser && msg.receiver === currentUser)) {
                allMessages.push(msg);
                renderMessages
