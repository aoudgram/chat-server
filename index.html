<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Messenger</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Login Screen */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #075e54; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: white; padding: 25px; border-radius: 8px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .login-box input { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; outline: none; }
        .login-box button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Main Container */
        #app-container { display: flex; flex-direction: column; height: 100vh; display: none; }
        .header { background: #075e54; color: white; padding: 15px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Contacts List View */
        #contacts-view { flex: 1; background: #fff; overflow-y: auto; padding: 10px; }
        .contact-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 16px; font-weight: bold; color: #333; }
        .contact-item:hover { background: #f9f9f9; }

        /* Chat View */
        #chat-view { flex: 1; display: flex; flex-direction: column; background: #efeae2; display: none; height: 100vh; }
        .chat-header { background: #075e54; color: white; padding: 12px 15px; display: flex; align-items: center; gap: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .message-bubble { max-width: 75%; padding: 10px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg { background: #dcf8c6; align-self: flex-end; }
        .other-msg { background: #ffffff; align-self: flex-start; }
        .msg-status { font-size: 10px; color: gray; text-align: right; margin-top: 4px; font-weight: bold; }

        /* Input Area */
        .input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 15px; padding-left: 15px; }
        .input-area button { background: #075e54; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 20px; font-size: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Messenger Login</h2>
            <input type="text" id="username-input" placeholder="Enter your name..." autofocus>
            <button id="login-btn">Start Chatting</button>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container">
        <!-- Contacts Screen -->
        <div id="contacts-screen" style="display: flex; flex-direction: column; height: 100vh;">
            <div class="header">
                <span>Chats</span>
                <span id="current-user-display" style="font-size: 13px; font-weight: normal;"></span>
            </div>
            <div id="contacts-view">
                <p style="text-align: center; color: gray; margin-top: 20px;">Waiting for other friends to join...</p>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view">
            <div class="chat-header" id="back-to-contacts">
                <span>← <span id="chat-with-name"></span></span>
            </div>
            <div id="chat-messages"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-msg-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const SOCKET_URL = "https://chat-server-0jul.onrender.com";
        const socket = io(SOCKET_URL);

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const currentUserDisplay = document.getElementById('current-user-display');
        
        const contactsScreen = document.getElementById('contacts-screen');
        const contactsView = document.getElementById('contacts-view');
        
        const chatView = document.getElementById('chat-view');
        const chatWithName = document.getElementById('chat-with-name');
        const chatMessages = document.getElementById('chat-messages');
        const msgInput = document.getElementById('msg-input');
        const sendMsgBtn = document.getElementById('send-msg-btn');
        const backBtn = document.getElementById('back-to-contacts');

        let myUsername = "";
        let activeRecipientSocketId = null;
        let messagesStore = {}; // { socketId: [ {id, text, sender, status} ] }
        let onlineUsersData = {};

        // Login Action
        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name !== "") {
                myUsername = name;
                socket.emit('join_system', myUsername);
                loginScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                currentUserDisplay.textContent = `Logged in as: ${myUsername}`;
            }
        });

        // Update Contacts List
        socket.optionList = socket.on('update_users', (users) => {
            onlineUsersData = users;
            contactsView.innerHTML = '';
            
            const ids = Object.keys(users);
            if (ids.length <= 1) {
                contactsView.innerHTML = '<p style="text-align: center; color: gray; margin-top: 20px;">No other friends online yet. Share the link!</p>';
                return;
            }

            ids.forEach(id => {
                if (id !== socket.id) {
                    const div = document.createElement('div');
                    div.classList.add('contact-item');
                    div.innerHTML = `<span>${users[id]}</span> <span style="font-size: 12px; color: green;">Online</span>`;
                    div.addEventListener('click', () => {
                        openChat(id, users[id]);
                    });
                    contactsView.appendChild(div);
                }
            });
        });

        function openChat(recipientId, recipientName) {
            activeRecipientSocketId = recipientId;
            chatWithName.textContent = recipientName;
            contactsScreen.style.display = 'none';
            chatView.style.display = 'flex';
            renderMessages();

            // Mark unread messages as Seen if opening chat
            if (messagesStore[recipientId]) {
                messagesStore[recipientId].forEach(msg => {
                    if (msg.sender !== myUsername && msg.status !== 'Seen') {
                        msg.status = 'Seen';
                        socket.emit('mark_as_seen', { senderSocketId: recipientId, messageId: msg.id });
                    }
                });
            }
        }

        backBtn.addEventListener('click', () => {
            chatView.style.display = 'none';
            contactsScreen.style.display = 'flex';
            activeRecipientSocketId = null;
        });

        // Send Message
        function sendTextMessage() {
            const text = msgInput.value.trim();
            if (text !== "" && activeRecipientSocketId) {
                const messageId = 'msg_' + Date.now() + Math.random();
                const msgObj = {
                    id: messageId,
                    text: text,
                    sender: myUsername,
                    status: 'Not Delivered' // Default starting state
                };

                if (!messagesStore[activeRecipientSocketId]) {
                    messagesStore[activeRecipientSocketId] = [];
                }
                messagesStore[activeRecipientSocketId].push(msgObj);
                renderMessages();
                msgInput.value = "";

                // Emit to server
                socket.emit('send_private_message', {
                    recipientSocketId: activeRecipientSocketId,
                    messageText: text,
                    messageId: messageId
                });
            }
        }

        sendMsgBtn.addEventListener('click', sendTextMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        // Receive Private Message
        socket.on('receive_private_message', (data) => {
            const { senderSocketId, senderUsername, messageText, messageId } = data;

            if (!messagesStore[senderSocketId]) {
                messagesStore[senderSocketId] = [];
            }

            messagesStore[senderSocketId].push({
                id: messageId,
                text: messageText,
                sender: senderUsername,
                status: 'Delivered'
            });

            // Agar hum usi user ki chat window mein hain, toh turant 'Seen' mark kar do
            if (activeRecipientSocketId === senderSocketId) {
                renderMessages();
                socket.emit('mark_as_seen', { senderSocketId: senderSocketId, messageId: messageId });
            }
        });

        // Message Status Updates (Delivered / Seen / Not Delivered)
        socket.on('message_status_update', (data) => {
            const { messageId, status } = data;
            
            // Search across all chats to update status
            for (let recipientId in messagesStore) {
                let found = messagesStore[recipientId].find(m => m.id === messageId);
                if (found) {
                    found.status = status;
                    if (activeRecipientSocketId === recipientId) {
                        renderMessages();
                    }
                    break;
                }
            }
        });

        function renderMessages() {
            chatMessages.innerHTML = '';
            if (!activeRecipientSocketId || !messagesStore[activeRecipientSocketId]) return;

            messagesStore[activeRecipientSocketId].forEach(msg => {
                const bubble = document.createElement('div');
                bubble.classList.add('message-bubble');
                
                if (msg.sender === myUsername) {
                    bubble.classList.add('my-msg');
                    bubble.innerHTML = `<div>${msg.text}</div><div class="msg-status">${msg.status}</div>`;
                } else {
                    bubble.classList.add('other-msg');
                    bubble.innerHTML = `<div>${msg.text}</div>`;
                }
                chatMessages.appendChild(bubble);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
                </html>
