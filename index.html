<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Local Chat</title>
    <!-- Socket.io Library -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #fff; padding: 10px 15px; border-radius: 8px; max-width: 75%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-break: break-word; }
        .my-message { background: #dcf8c6; align-self: flex-end; }
        #input-box { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 16px; }
        #send-btn { background: #0084ff; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        #typing-status { font-size: 12px; color: gray; padding: 0 15px; height: 18px; }
    </style>
</head>
<body>

    <div id="chat-box"></div>
    <div id="typing-status"></div>

    <div id="input-box">
        <input type="text" id="message-input" placeholder="Message likho..." autofocus>
        <button id="send-btn">Bhejo</button>
    </div>

    <script>
        // Yahan tera live Render URL set kar diya hai!
        const SOCKET_URL = "https://chat-server-0jul.onrender.com"; 
        const socket = io(SOCKET_URL);

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const typingStatus = document.getElementById('typing-status');

        // Message bhejne ka function
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text !== "") {
                socket.emit('send_message', { text: text });
                messageInput.value = "";
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
            socket.emit('typing');
        });

        // Server se message milne par
        socket.on('receive_message', (data) => {
            const div = document.createElement('div');
            div.classList.add('message');
            div.textContent = data.text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Typing indicator
        socket.on('display_typing', () => {
            typingStatus.textContent = "Koi type kar raha hai...";
            setTimeout(() => {
                typingStatus.textContent = "";
            }, 1500);
        });
    </script>
</body>
  </html>
